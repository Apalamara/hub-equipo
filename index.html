<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>El Hub · Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@500;600;700&family=Aleo:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Paleta tomada de la app del Desafio de las cinco semanas, para que las
   herramientas de la iglesia se sientan de la misma familia. */
:root {
  --azul: #2459c9;
  --azul-claro: #eaf1ff;
  --azul-medio: #b8caf2;
  --tinta: #162138;
  --gris: #627087;
  --borde: #dbe3f2;
  --fondo: #f8faff;
  --blanco: #ffffff;
  --verde: #14945d;
  --verde-claro: #e7f4ec;
  --alerta: #b4531f;
  --alerta-claro: #fff3ef;
  --radio: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fondo);
  color: var(--tinta);
  font: 16px/1.5 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, .num { font-family: Outfit, sans-serif; letter-spacing: -0.01em; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- encabezado y navegacion ---------- */
header {
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
  position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top);
}
.barra {
  max-width: 1080px; margin: 0 auto; padding: 14px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.marca { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; }
.marca small { color: var(--gris); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.marca b { font: 700 22px Outfit, sans-serif; }
nav { display: flex; gap: 4px; background: var(--fondo); border: 1px solid var(--borde); border-radius: 12px; padding: 4px; }
nav button {
  border: 0; background: none; padding: 9px 18px; border-radius: 9px;
  font-weight: 500; color: var(--gris); min-height: 44px;
}
nav button[aria-current="page"] { background: var(--blanco); color: var(--azul); box-shadow: 0 1px 2px rgba(22,33,56,.08); }

main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
section[hidden] { display: none; }
.rotulo { color: var(--azul); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.sub { color: var(--gris); margin: 6px 0 0; }

/* ---------- quien soy ---------- */
.quien { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 24px; color: var(--gris); font-size: 15px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--borde); background: var(--blanco); border-radius: 999px;
  padding: 7px 14px; min-height: 40px; font-weight: 500; font-size: 15px;
}
.chip { display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-solido, var(--azul)); }
.chip[aria-pressed="true"] { background: var(--c-solido, var(--azul)); border-color: var(--c-solido, var(--azul)); color: #fff; }
.chip[aria-pressed="true"] i { background: #fff; }

/* ---------- hoy ---------- */
.turnos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
.turno {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 190px;
}
.turno .num { font-size: 44px; font-weight: 600; line-height: 1; }
.turno .num span { font-size: 20px; color: var(--gris); font-weight: 500; margin-left: 2px; }
.llegada { color: var(--gris); font-size: 14px; }
.llegada b { color: var(--tinta); font-weight: 700; }
.gente { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
/* cada voluntario tiene su color (ver COLORES en el script) */
.persona { background: var(--c-fondo, var(--azul-claro)); color: var(--c-texto, var(--azul)); border-radius: 8px; padding: 5px 11px; font-weight: 700; }
.persona.yo { background: var(--c-solido, var(--azul)); color: #fff; }
.falta { background: var(--alerta-claro); color: var(--alerta); border-radius: 8px; padding: 5px 11px; font-weight: 700; }
.turno.vacio { border-color: #f3c9b5; }
.nota { font-size: 14px; color: var(--gris); }

.aviso {
  margin-top: 20px; background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 18px 22px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
}
.aviso.mio { background: var(--azul-claro); border-color: var(--azul-medio); }
.aviso b { font-family: Outfit, sans-serif; font-size: 20px; }

/* ---------- turnos (calendario) ---------- */
.mesbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.mesbar h2 { font-size: 30px; margin-right: auto; text-transform: capitalize; }
.flecha {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--borde);
  background: var(--blanco); font-size: 20px; line-height: 1;
}
.flecha:disabled { opacity: .35; cursor: default; }
.solo { display: flex; align-items: center; gap: 8px; color: var(--gris); font-size: 15px; min-height: 44px; }
.solo input { width: 20px; height: 20px; accent-color: var(--azul); }
.dias { display: grid; gap: 12px; }
.dia {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  display: grid; grid-template-columns: 130px repeat(3, 1fr); align-items: stretch;
}
.dia.pasado { opacity: .55; }
.dia.hoy { border-color: var(--azul); box-shadow: 0 0 0 1px var(--azul); }
.fecha { padding: 16px 18px; border-right: 1px solid var(--borde); display: flex; flex-direction: column; justify-content: center; }
.fecha .num { font-size: 34px; font-weight: 600; line-height: 1; }
.fecha small { color: var(--gris); font-size: 13px; }
.celda { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--borde); }
.celda:last-child { border-right: 0; }
.celda .hora { font: 600 17px Outfit, sans-serif; }
.celda .hora span { color: var(--gris); font: 400 13px 'DM Sans', sans-serif; margin-left: 6px; }
.celda .gente { margin-top: 0; }
.vacio-mes { color: var(--gris); padding: 28px; text-align: center; background: var(--blanco); border: 1px dashed var(--borde); border-radius: var(--radio); }

/* ---------- entregas ---------- */
.horarios { display: flex; gap: 8px; margin: 20px 0 22px; flex-wrap: wrap; }
.horarios button {
  border: 1px solid var(--borde); background: var(--blanco); border-radius: 12px;
  padding: 10px 22px; min-height: 52px; font: 600 20px Outfit, sans-serif;
}
.horarios button[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; }
.horarios button:disabled { opacity: .4; cursor: default; }
.materiales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.material {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.material h3 { font-size: 22px; }
.material small { color: var(--gris); font-size: 14px; margin-top: -8px; }
.contador { display: flex; align-items: center; gap: 14px; }
.contador .num { font-size: 64px; font-weight: 600; min-width: 1.6em; text-align: center; line-height: 1; }
.contador button {
  width: 72px; height: 72px; border-radius: 18px; font-size: 36px; line-height: 1;
  border: 1px solid var(--borde); background: var(--fondo); color: var(--tinta);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.contador button.mas { background: var(--azul); border-color: var(--azul); color: #fff; }
.contador button:active { transform: scale(.96); }
.contador button:disabled { opacity: .35; }
.guardando { color: var(--gris); font-size: 13px; min-height: 1.2em; }
.guardando.error { color: var(--alerta); font-weight: 500; }
.sin-cargar { color: var(--azul); font-weight: 600; font-size: 14px; min-height: 1.3em; }
.carga { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.carga .boton.primario { min-height: 56px; padding: 10px 40px; font: 600 20px Outfit, sans-serif; }
.carga .guardando { flex: 1 1 220px; font-size: 15px; }
.guardando.ok { color: #18794e; font-weight: 500; }
.guardando.por-cargar { color: var(--azul); font-weight: 500; }
.horarios button.con-pendiente::after, nav button.con-pendiente::after { content: ' •'; color: #e5484d; }
.totales { margin-top: 20px; color: var(--gris); }
.totales b { color: var(--tinta); }

/* ---------- stock ---------- */
.stock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 22px; }
.item {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 20px; display: flex; flex-direction: column; gap: 6px;
}
.item.bajo { border-color: #f3c9b5; background: var(--alerta-claro); }
.item h3 { font-size: 19px; }
.item .num { font-size: 52px; font-weight: 600; line-height: 1.05; }
.item small { color: var(--gris); font-size: 13px; }
.pill { align-self: flex-start; border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: 14px; background: var(--verde-claro); color: var(--verde); }
.item.bajo .pill { background: var(--alerta); color: #fff; }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.boton {
  border: 1px solid var(--borde); background: var(--blanco); border-radius: 12px;
  padding: 10px 20px; min-height: 48px; font-weight: 700;
}
.boton.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
.boton:disabled { opacity: .5; cursor: default; }
.form { background: var(--blanco); border: 1px solid var(--azul-medio); border-radius: var(--radio); padding: 20px 22px; margin-top: 16px; }
.form h3 { font-size: 20px; }
.campos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
.campos label, .form .nota-campo { display: flex; flex-direction: column; gap: 4px; font-weight: 500; font-size: 15px; }
.form input {
  font: inherit; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; min-height: 48px;
  width: 100%; background: var(--fondo); color: var(--tinta);
}
.form input[type=number] { font: 600 22px Outfit, sans-serif; }
.movs { margin-top: 28px; }
.movs h2 { font-size: 22px; margin-bottom: 10px; }
.movs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.movs li { background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 16px; }
.movs li b { font-family: Outfit, sans-serif; }
.movs li span { color: var(--gris); font-size: 14px; }

/* ---------- eventos ---------- */
.ev-grupo { margin-top: 28px; }
.ev-grupo > h2 { font-size: 22px; margin-bottom: 10px; }
.fichas { display: grid; gap: 10px; }
.ficha {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 14px; display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: start;
}
.ficha.sin-cuando { grid-template-columns: 1fr auto; padding-left: 18px; }
.ficha .cuando {
  background: var(--azul-claro); color: var(--azul); border-radius: 12px; padding: 8px 4px;
  text-align: center; line-height: 1.1; display: flex; flex-direction: column; align-items: center;
}
.ficha .cuando b { font: 700 24px Outfit, sans-serif; }
.ficha .cuando .dia-sem { font-size: 18px; text-transform: capitalize; }
.ficha .cuando span { font: 600 13px Outfit, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.ficha .cuando small { margin-top: 4px; font-size: 12px; color: var(--tinta); }
.ficha .cuerpo { min-width: 0; padding-top: 2px; }
.ficha h3 { font-size: 18px; line-height: 1.25; }
.ficha p { margin: 4px 0 0; color: var(--gris); font-size: 15px; }
.ficha .miniatura img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; display: block; }
.termina { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 700; margin: 0 6px 4px 0; background: var(--alerta-claro); color: var(--alerta); }
.pronto { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 700; margin: 0 6px 4px 0; background: var(--azul); color: #fff; }
.tarjeta img { width: 100%; max-width: 420px; border-radius: 10px; margin-top: 10px; display: block; }
/* los links dentro de un texto: un boton chico, facil de tocar */
a.link {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 5px 12px; min-height: 32px;
  background: var(--azul-claro); color: var(--azul); border-radius: 999px; font-weight: 600; font-size: 14px; text-decoration: none;
}
.area { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 700; margin-bottom: 4px; background: var(--a-fondo, #e9edf3); color: var(--a-texto, #46536a); }

/* ---------- manual (estilo del manual de Canva) ---------- */
body { overflow-x: clip; }
#v-manual { --cielo: #3f9dd6; --cielo-osc: #1e8fd0; --cielo-claro: #e8f4fc; --serif: Aleo, Georgia, serif; }
.m-banda { margin: 0 calc(50% - 50vw); padding: 56px max(20px, calc(50vw - 520px)); scroll-margin-top: 90px; }
.m-h2 { font: 600 clamp(32px, 5vw, 46px)/1.1 var(--serif); color: var(--cielo); margin-bottom: 24px; letter-spacing: 0; }
.m-h3 { font: 600 24px/1.2 var(--serif); color: var(--cielo-osc); margin-bottom: 10px; letter-spacing: 0; }
.m-hero {
  margin-top: -28px; background: var(--cielo); color: #fff; text-align: center;
  position: relative; overflow: hidden; padding-top: 88px; padding-bottom: 96px;
}
.m-blob {
  position: absolute; left: 50%; top: 50%; width: 520px; height: 440px; transform: translate(-50%, -50%) rotate(-18deg);
  background: rgba(255,255,255,.18); border-radius: 58% 42% 55% 45% / 45% 55% 45% 55%;
}
.m-hero > :not(.m-blob) { position: relative; }
.m-hero small { display: block; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.m-hero h1 { font: 500 clamp(64px, 12vw, 104px)/1 var(--serif); margin: 14px 0 26px; letter-spacing: 0; }
.m-logo { display: block; width: min(340px, 78vw); height: auto; margin: 0 auto; }
.m-pill {
  display: inline-block; background: #fff; color: var(--cielo-osc); border-radius: 999px;
  padding: 12px 34px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; max-width: 100%;
}
.m-frase { background: linear-gradient(180deg, var(--cielo-claro), #fff); text-align: center; padding-top: 64px; padding-bottom: 64px; }
.m-frase p { font: 600 clamp(26px, 4vw, 38px)/1.25 var(--serif); color: var(--cielo-osc); margin: 0 auto; max-width: 640px; }
.m-indice { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 8px; padding-bottom: 40px; }
.m-indice a {
  text-decoration: none; color: var(--cielo-osc); border: 2px solid var(--cielo-claro); background: #fff;
  border-radius: 999px; padding: 8px 18px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
}
.m-indice a b { font: 600 13px Outfit, sans-serif; color: var(--cielo); }
.m-blanca { background: #fff; }
.m-celeste { background: var(--cielo-osc); color: #fff; }
.m-celeste .m-h2, .m-celeste .m-h3, .m-celeste .m-num, .m-celeste .m-funciones .m-h3 { color: #fff; }
.m-num { font: 700 14px Outfit, sans-serif; letter-spacing: .12em; color: var(--cielo); margin-bottom: 4px; }
.m-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 36px 48px; }
.m-item { font-size: 17px; line-height: 1.6; }
.m-item p { margin: 0 0 12px; }
.m-item ul { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 10px; }
.m-item li { position: relative; padding-left: 26px; }
.m-item li::before { content: ''; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; background: var(--cielo); border-radius: 50%; }
.m-celeste .m-item li::before { background: #fff; }
.m-item.check li::before { left: 0; top: .3em; width: 16px; height: 16px; background: none; border: 2px solid currentColor; border-radius: 5px; opacity: .8; }
.m-celeste .pendiente { background: #fff; }
.m-funciones { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 28px; align-items: center; }
.m-funciones .m-h3 { font-size: clamp(30px, 4vw, 40px); text-align: center; color: var(--cielo); }
.m-funciones ul { list-style: none; margin: 0; padding: 0; border-radius: var(--radio); overflow: hidden; }
.m-funciones li { display: flex; align-items: center; gap: 22px; padding: 22px 28px; color: #fff; font: 600 20px/1.3 Outfit, sans-serif; }
.m-funciones li:nth-child(4n+1) { background: #7bbde4; }
.m-funciones li:nth-child(4n+2) { background: #1e8fd0; }
.m-funciones li:nth-child(4n+3) { background: #157bb6; }
.m-funciones li:nth-child(4n+4) { background: #5aa9db; }
.m-funciones svg { width: 52px; height: 52px; flex-shrink: 0; fill: none; stroke: #fff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.m-gracias { background: var(--cielo-osc); color: #fff; text-align: center; padding-bottom: 72px; }
.m-gracias .m-h2 { color: #fff; }
.m-gracias blockquote {
  margin: 0 auto; max-width: 520px; background: #fff; color: var(--cielo-osc); border-radius: 999px;
  padding: 14px 32px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 14px; line-height: 1.4;
}
.m-gracias cite { display: inline-block; margin-top: 14px; background: #fff; color: var(--cielo-osc); border-radius: 999px; padding: 6px 20px; font: 700 13px 'DM Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 820px) {
  .m-funciones { grid-template-columns: 1fr; }
  .m-funciones li { padding: 18px 20px; font-size: 17px; gap: 16px; }
  .m-funciones svg { width: 40px; height: 40px; }
  .m-gracias blockquote { border-radius: 22px; }
}
@media (max-width: 560px) {
  .m-hero { margin-top: -20px; }
  .m-banda { padding-top: 44px; padding-bottom: 44px; }
}

.tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.tarjeta { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); padding: 22px 24px; }
.tarjeta h3 { font-size: 20px; margin-bottom: 10px; }
.tarjeta p { margin: 0 0 10px; }
.tarjeta p:last-child, .tarjeta ul:last-child { margin-bottom: 0; }
.tarjeta ul { margin: 0 0 10px; padding: 0; list-style: none; display: grid; gap: 8px; }
.tarjeta li { position: relative; padding-left: 26px; }
.tarjeta li::before {
  content: ''; position: absolute; left: 6px; top: .6em; width: 7px; height: 7px;
  background: var(--azul-medio); border-radius: 50%;
}
/* las tarjetas cuyo titulo dice "checklist" llevan casilleros en vez de puntos */
.tarjeta.check li::before {
  left: 0; top: .3em; width: 14px; height: 14px; background: none;
  border: 2px solid var(--azul-medio); border-radius: 5px;
}
.pendiente { background: var(--alerta-claro); color: var(--alerta); border-radius: 6px; padding: 1px 6px; font-weight: 500; }

/* ---------- estados ---------- */
.estado { text-align: center; padding: 80px 20px; color: var(--gris); }
.estado h2 { color: var(--tinta); font-size: 26px; margin-bottom: 8px; }
.pie { color: var(--gris); font-size: 13px; margin-top: 36px; text-align: center; }
.pie button { border: 0; background: none; color: var(--azul); font-weight: 500; padding: 8px; }

/* iPad vertical y celulares: el calendario pasa a tarjetas apiladas */
@media (max-width: 820px) {
  .turnos, .materiales { grid-template-columns: 1fr; }
  .stock, .campos { grid-template-columns: 1fr 1fr; }
  .item .num { font-size: 40px; }
  .material { flex-direction: row; justify-content: space-between; padding: 16px; }
  .material > div:first-child { display: flex; flex-direction: column; min-width: 0; }
  .material h3 { font-size: 19px; }
  .material small { margin-top: 0; font-size: 13px; }
  .contador { gap: 8px; flex-shrink: 0; }
  .contador .num { font-size: 38px; min-width: 1.4em; }
  .contador button { width: 54px; height: 54px; font-size: 28px; border-radius: 14px; }
  .turno { min-height: 0; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .turno .num { font-size: 34px; }
  .turno .gente { margin-top: 0; margin-left: auto; }
  .dia { grid-template-columns: 1fr; }
  .fecha { border-right: 0; border-bottom: 1px solid var(--borde); flex-direction: row; align-items: baseline; gap: 10px; padding: 12px 16px; }
  .fecha .num { font-size: 26px; }
  .celda { border-right: 0; border-bottom: 1px solid var(--borde); flex-direction: row; align-items: center; justify-content: space-between; }
}
@media (max-width: 560px) {
  .barra { padding: 12px 16px; }
  main { padding: 20px 16px 48px; }
  /* seis pestañas no entran en un celular: la barra se desliza de costado */
  nav { width: 100%; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: 1 0 auto; padding: 9px 12px; }
  .turno .gente { margin-left: 0; width: 100%; }
  .ficha { grid-template-columns: 56px 1fr auto; gap: 12px; padding: 12px; }
  .ficha .miniatura img { width: 64px; height: 64px; }
}
</style>
</head>
<body>

<header>
  <div class="barra">
    <div class="marca"><small>Saddleback Buenos Aires</small><b>El Hub · Equipo</b></div>
    <nav>
      <button data-vista="info" aria-current="page">Info</button>
      <button data-vista="turnos">Turnos</button>
      <button data-vista="entregas">Entregas</button>
      <button data-vista="stock">Stock</button>
      <button data-vista="manual">Manual</button>
    </nav>
  </div>
</header>

<main>
  <div id="estado" class="estado"><h2>Cargando…</h2></div>

  <!-- ids con prefijo: si fueran "turnos" o "manual", el #turnos del link haria saltar la pagina -->
  <section id="v-turnos" hidden></section>
  <section id="v-entregas" hidden></section>
  <section id="v-stock" hidden></section>
  <section id="v-info" hidden></section>
  <section id="v-manual" hidden></section>

  <p class="pie" id="pie" hidden></p>
</main>

<script>
// Los datos viven en el Google Sheet "Hub Voluntarios". Esta URL es el Apps
// Script pegado en ese Sheet (app/apps-script.gs). La clave NO va aca: llega
// en el link privado (?clave=...) y se recuerda en este dispositivo.
const API = 'https://script.google.com/macros/s/AKfycbx6PpKhTZfvr-JxrymIN55S7BPou-qvh4Gg-15BGc8xyHhchOJtk3WA5r8wAd7SAzJv/exec';

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $ = s => document.querySelector(s);

// localStorage puede fallar (modo privado, datos bloqueados): la app anda igual.
const guardado = {
  leer(k) { try { return localStorage.getItem('hub.' + k); } catch (e) { return null; } },
  escribir(k, v) { try { v == null ? localStorage.removeItem('hub.' + k) : localStorage.setItem('hub.' + k, v); } catch (e) {} },
};

const estado = {
  datos: null,
  yo: guardado.leer('yo'),
  mes: null,        // 'AAAA-MM' que muestra la vista Turnos
  soloMios: false,
};

// ---------- utilidades ----------

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fechaDe(s) { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); }
function nombres(celda) { return String(celda || '').split(',').map(s => s.trim()).filter(Boolean); }
function hora(h) { return String(h || '').replace(/:00$/, ''); }

// El domingo que importa: hoy si es domingo y todavia no termino la ultima
// reunion (hasta las 20), si no el proximo.
function domingoActual() {
  const ahora = new Date();
  const d = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  if (d.getDay() === 0 && ahora.getHours() < 20) return iso(d);
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return iso(d);
}

// Turnos agrupados por fecha: { '2026-10-04': [fila 10hs, fila 12hs, fila 18hs] }
function porFecha() {
  const g = {};
  estado.datos.Turnos.forEach(t => { if (t.Fecha) (g[t.Fecha] = g[t.Fecha] || []).push(t); });
  Object.values(g).forEach(l => l.sort((a, b) => a['Reunión'].localeCompare(b['Reunión'])));
  return g;
}

// Un color por voluntario. Manda la columna "Color" de la pestaña
// Voluntarios si existe (azul, verde, violeta, ambar, rosa, turquesa, oliva o
// gris); si no, ELEGIDOS; y a alguien nuevo le toca uno de los que sobran,
// segun su lugar en la lista. Sin naranja: ese es "Falta cubrir".
const COLORES = {
  azul:     ['#e3ecff', '#1f4fb8', '#2459c9'],
  verde:    ['#e2f5ea', '#11774b', '#14945d'],
  violeta:  ['#efe7fd', '#6a3fc2', '#7c4ddb'],
  ambar:    ['#fdf1d8', '#8a5a00', '#c28405'],
  rosa:     ['#fde6ef', '#b0285f', '#d23a78'],
  turquesa: ['#dff4f6', '#0e6f7a', '#13909e'],
  oliva:    ['#eef3dc', '#566510', '#76891a'],
  gris:     ['#e9edf3', '#46536a', '#5b6b84'],
};
const ELEGIDOS = { Ani: 'rosa', Mar: 'verde', Joha: 'violeta', Gerby: 'ambar', Martu: 'turquesa', Facu: 'azul' };

function nombreColor(nombre) {
  const vols = estado.datos.Voluntarios;
  const v = vols.find(x => x.Nombre === nombre);
  if (!v) return null;
  const pedido = String(v.Color || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (COLORES[pedido]) return pedido;
  if (ELEGIDOS[nombre]) return ELEGIDOS[nombre];
  const usados = new Set(Object.values(ELEGIDOS));
  const libres = Object.keys(COLORES).filter(c => !usados.has(c));
  const sinElegir = vols.filter(x => !ELEGIDOS[x.Nombre]);
  return libres[sinElegir.indexOf(v) % libres.length];
}
function color(nombre) {
  const c = nombreColor(nombre);
  if (!c) return '';
  const [f, t, s] = COLORES[c];
  return `style="--c-fondo:${f};--c-texto:${t};--c-solido:${s}"`;
}

function activos() {
  return estado.datos.Voluntarios.filter(v => String(v.Activo).toUpperCase() === 'SI');
}

function gente(t) {
  const ns = nombres(t.Voluntarios);
  if (!ns.length) return '<span class="falta">Falta cubrir</span>';
  return ns.map(n => `<span class="persona${n === estado.yo ? ' yo' : ''}" ${color(n)}>${esc(n)}</span>`).join('');
}

// ---------- quien sos ----------

function quienSos() {
  return `<div class="quien">¿Quién sos? <div class="chips">${activos().map(v =>
    `<button class="chip" data-yo="${esc(v.Nombre)}" aria-pressed="${v.Nombre === estado.yo}" ${color(v.Nombre)}><i></i>${esc(v.Nombre)}</button>`).join('')}</div></div>`;
}

// "Tu proximo turno" para quien eligio su nombre
function avisoProximo(g, desde) {
  if (!estado.yo) return '';
  // desde el domingo que se muestra: un turno de hoy que ya termino no es "proximo"
  const fechas = Object.keys(g).filter(f => f >= desde).sort();
  for (const f of fechas) {
    const mios = g[f].filter(t => nombres(t.Voluntarios).includes(estado.yo));
    if (mios.length) {
      const d = fechaDe(f);
      const horas = mios.map(t => `${hora(t['Reunión'])} hs (llegada ${t.Llegada})`).join(' y ');
      const cuando = f === desde ? 'Este domingo' : `Domingo ${d.getDate()} de ${MESES[d.getMonth()]}`;
      return `<div class="aviso mio"><span>Tu próximo turno</span><b>${cuando} · ${esc(horas)}</b></div>`;
    }
  }
  return `<div class="aviso"><span>${esc(estado.yo)}, no tenés turnos cargados por ahora.</span></div>`;
}

// ---------- vista: turnos ----------

function vistaTurnos() {
  const g = porFecha();
  const meses = [...new Set(Object.keys(g).map(f => f.slice(0, 7)))].sort();
  if (!estado.mes) {
    const actual = domingoActual().slice(0, 7);
    estado.mes = meses.includes(actual) ? actual : meses[meses.length - 1];
  }
  const i = meses.indexOf(estado.mes);
  const [a, m] = estado.mes.split('-').map(Number);
  const hoy = iso(new Date());
  const dom = domingoActual();

  let fechas = Object.keys(g).filter(f => f.startsWith(estado.mes)).sort();
  if (estado.soloMios && estado.yo) {
    fechas = fechas.filter(f => g[f].some(t => nombres(t.Voluntarios).includes(estado.yo)));
  }

  let html = quienSos() + avisoProximo(g, dom) + `
    <div class="mesbar">
      <h2>${MESES[m - 1]} ${a}</h2>
      ${estado.yo ? `<label class="solo"><input type="checkbox" id="soloMios" ${estado.soloMios ? 'checked' : ''}> Solo mis turnos</label>` : ''}
      <button class="flecha" data-mes="${meses[i - 1] || ''}" ${i > 0 ? '' : 'disabled'} aria-label="Mes anterior">‹</button>
      <button class="flecha" data-mes="${meses[i + 1] || ''}" ${i < meses.length - 1 ? '' : 'disabled'} aria-label="Mes siguiente">›</button>
    </div>`;

  if (!fechas.length) {
    html += `<div class="vacio-mes">${estado.soloMios ? 'No tenés turnos este mes.' : 'No hay turnos cargados este mes.'}</div>`;
  } else {
    html += '<div class="dias">' + fechas.map(f => {
      const d = fechaDe(f);
      const cls = f === dom ? ' hoy' : (f < hoy ? ' pasado' : '');
      return `<div class="dia${cls}">
        <div class="fecha"><span class="num">${d.getDate()}</span><small>${f === dom ? (f === hoy ? 'hoy' : 'próximo') : 'domingo'}</small></div>
        ${g[f].map(t => `<div class="celda">
          <div class="hora">${esc(hora(t['Reunión']))} hs<span>llegada ${esc(t.Llegada)}</span></div>
          <div class="gente">${gente(t)}</div>
        </div>`).join('')}
      </div>`;
    }).join('') + '</div>';
  }
  $('#v-turnos').innerHTML = html;
}

// ---------- vista: manual ----------

// El texto del Sheet se escribe simple: parrafos separados por una linea en
// blanco, y las listas con "- " al principio de cada renglon.
function textoManual(t) {
  return String(t || '').split(/\n\s*\n/).map(bloque => {
    const lineas = bloque.split('\n').map(l => l.trim()).filter(Boolean);
    // los links se pueden tocar; se muestra solo el sitio (www.algo.com/... → algo.com)
    const conPendientes = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="pendiente">$1</span>')
      .replace(/https:\/\/[^\s<]+/g, u => `<a class="link" href="${u}" target="_blank" rel="noopener">${u.replace(/^https:\/\/(www\.)?/, '').split('/')[0]} ↗</a>`);
    if (lineas.length && lineas.every(l => l.startsWith('- '))) {
      return '<ul>' + lineas.map(l => `<li>${conPendientes(l.slice(2))}</li>`).join('') + '</ul>';
    }
    return '<p>' + lineas.map(conPendientes).join('<br>') + '</p>';
  }).join('');
}

// Inspirado en el manual de Canva: franjas celestes y blancas que se alternan,
// titulos con serifa, las funciones del Hub con iconos y un cierre con el
// versiculo. El contenido sigue saliendo de la pestaña Manual del Sheet.
const ICONOS = {
  conectar: '<circle cx="9" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M3 21v-1a6 6 0 0 1 10-4.5M15 4.5A8 8 0 0 1 20.5 12M4 12a8 8 0 0 0 1 4"/>',
  regalo: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8S10.5 3 8 3.5 7 8 12 8zM12 8s1.5-5 4-4.5S17 8 12 8z"/>',
  guiar: '<path d="M7 21v-6l-3-4V5a1.5 1.5 0 0 1 3 0v5M17 21v-6l3-4V5a1.5 1.5 0 0 0-3 0v5M7 10l3 3v8M17 10l-3 3v8"/>',
  recursos: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><circle cx="12" cy="10.5" r="4"/><path d="M12 10v3M12 8.3v.2"/>',
};
function icono(texto) {
  const t = sinTilde(texto);
  const k = /conect/.test(t) ? 'conectar' : /regal/.test(t) ? 'regalo' : /guia|pasos/.test(t) ? 'guiar' : 'recursos';
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONOS[k]}</svg>`;
}

function itemManual(it) {
  const titulo = it['Título'];
  // "Funciones del Hub": una franja por funcion, con su icono
  if (/funciones/i.test(titulo)) {
    const lineas = String(it.Texto || '').split('\n').map(l => l.trim().replace(/^- /, '')).filter(Boolean);
    return `<div class="m-funciones"><h3 class="m-h3">${esc(titulo)}</h3>
      <ul>${lineas.map(l => `<li>${icono(l)}<span>${esc(l)}</span></li>`).join('')}</ul></div>`;
  }
  return `<article class="m-item${/checklist/i.test(titulo) ? ' check' : ''}"><h3 class="m-h3">${esc(titulo)}</h3>${textoManual(it.Texto)}</article>`;
}

// ---------- imagenes ----------

// En el Sheet va el link de Drive tal cual se copia ("Compartir > cualquier
// persona con el link"); se muestra la miniatura grande de Drive. Cualquier
// otra URL de imagen tambien sirve.
function imagen(link) {
  const url = String(link || '').trim();
  if (!/^https:\/\//.test(url)) return '';
  const id = (url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]+)/) || [])[1];
  const src = id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : url;
  return `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="" loading="lazy"></a>`;
}

// ---------- vista: eventos ----------

// Los colores de cada area, como en el calendario de la iglesia. Un area
// nueva sale en gris hasta que se agregue aca.
const AREAS = {
  'worship':        ['#ececec', '#4a4a4a'],
  'peace':          ['#e2f2dc', '#3d6b2c'],
  'cr':             ['#eef1f5', '#46536a'],
  'cr (sym)':       ['#eef1f5', '#46536a'],
  'jóvenes':        ['#f6e3fa', '#86308f'],
  'gam':            ['#dde4f0', '#1f3a68'],
  'conexiones':     ['#fdf0cc', '#7a5800'],
  'crec. esp.':     ['#dfeaf7', '#2b5a8c'],
  'grupos pequeños':['#e3ecff', '#1f4fb8'],
};
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const sinTilde = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

function area(nombre) {
  if (!nombre) return '';
  const c = AREAS[String(nombre).toLowerCase().trim()];
  return `<span class="area" ${c ? `style="--a-fondo:${c[0]};--a-texto:${c[1]}"` : ''}>${esc(nombre)}</span>`;
}

function eventosDe() {
  const ev = estado.datos.Eventos || [];
  return {
    fechados: ev.filter(e => e.Fecha && !e.Hasta && !e['Día']).sort((a, b) => (a.Fecha + (a.Hora || '')).localeCompare(b.Fecha + (b.Hora || ''))),
    temporadas: ev.filter(e => e.Fecha && e.Hasta && !e['Día']),
    // los semanales pueden tener Fecha (desde) y Hasta (hasta cuando hay)
    semanales: ev.filter(e => e['Día'])
      .sort((a, b) => DIAS.map(sinTilde).indexOf(sinTilde(a['Día'])) - DIAS.map(sinTilde).indexOf(sinTilde(b['Día']))),
  };
}

// Una ficha: cuando (a la izquierda), que es (al medio) y la foto chica (a la derecha).
function ficha(cuando, titulo, texto, img, extra) {
  const url = String(img || '').trim();
  return `<article class="ficha${cuando ? '' : ' sin-cuando'}">
    ${cuando ? `<div class="cuando">${cuando}</div>` : ''}
    <div class="cuerpo">${extra || ''}<h3>${esc(titulo)}</h3>${texto ? textoManual(texto) : ''}</div>
    ${/^https:\/\//.test(url) ? `<div class="miniatura">${imagen(url)}</div>` : ''}
  </article>`;
}

function cuandoFecha(e) {
  const d = fechaDe(e.Fecha);
  return `<b>${d.getDate()}</b><span>${MESES[d.getMonth()].slice(0, 3)}</span><small>${DIAS[d.getDay()].slice(0, 3)}${e.Hora ? '<br>' + esc(hora(e.Hora)) + ' hs' : ''}</small>`;
}

// ---------- vista: info ----------

// La primera pestaña: lo que pasa en la iglesia (pestaña Eventos del Sheet:
// con Fecha, temporadas con Fecha y Hasta, o semanales con Día) y lo que hay
// que tener a mano (pestaña Info: Orden, Título, Texto, Imagen).
function vistaInfo() {
  const { fechados, temporadas, semanales } = eventosDe();
  const hoy = iso(new Date());
  const pronto = new Date(); pronto.setDate(pronto.getDate() + 7);
  const proximos = fechados.filter(e => e.Fecha >= hoy);
  const vigentes = temporadas.filter(e => e.Hasta >= hoy);
  const items = (estado.datos.Info || []).slice().sort((a, b) => Number(a.Orden) - Number(b.Orden));
  const grupo = (titulo, sub, fichas) => fichas.length
    ? `<div class="ev-grupo"><h2>${titulo}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}<div class="fichas">${fichas.join('')}</div></div>` : '';

  let html = `
    <div class="rotulo">Info</div>
    <h1 style="font-size:clamp(30px,4.4vw,44px)">Lo que hay que saber</h1>
    <p class="sub">Qué pasa en la iglesia, para saber qué contestar si alguien pregunta en el Hub.</p>`;
  html += grupo('Próximas fechas', '', [
    ...vigentes.map(e => ficha(`<span>hasta</span><b>${fechaCorta(e.Hasta)}</b><small>desde ${fechaCorta(e.Fecha)}</small>`, e.Evento, e.Nota, e.Imagen, area(e['Área']))),
    ...proximos.map(e => ficha(cuandoFecha(e), e.Evento, e.Nota, e.Imagen,
      (e.Fecha <= iso(pronto) ? '<span class="pronto">Esta semana</span>' : '') + area(e['Área']))),
  ]);
  const termina = e => !e.Hasta ? ''
    : `<span class="termina">${e.Hasta <= iso(pronto) ? 'Última vez' : 'Termina'} el ${DIAS[fechaDe(e.Hasta).getDay()].slice(0, 3)} ${fechaCorta(e.Hasta)}</span>`;
  html += grupo('Todas las semanas', '', semanales.filter(e => !e.Hasta || e.Hasta >= hoy).map(e =>
    ficha(`<b class="dia-sem">${esc(String(e['Día']).slice(0, 3))}</b>${e.Hora ? `<small>${esc(hora(e.Hora))} hs</small>` : ''}`, e.Evento, e.Nota, e.Imagen, termina(e) + area(e['Área']))));
  html += grupo('Para tener a mano', 'Links para pasarle a quien pregunte.', items.map(it => ficha('', it['Título'], it.Texto, it.Imagen)));
  if (!proximos.length && !vigentes.length && !semanales.length && !items.length) {
    html += `<div class="vacio-mes" style="margin-top:22px">Todavía no hay nada cargado en las pestañas Eventos e Info del Sheet.</div>`;
  }
  $('#v-info').innerHTML = html;
}

// ---------- vista: stock ----------

// Lo que queda de cada cosa = ultimo recuento + compras posteriores - entregas
// posteriores. Las tarjetas van con cada chocolate. Un recuento sin hora (los
// viejos) cuenta lo que habia al final de ese dia.
const STOCK = [
  ['Chocolates', 'comprar'],
  ['Bolsas', 'comprar'],
  ['Biblias', 'comprar'],
  ['Tarjetas', 'imprimir'],
];
const MINIMOS = { Chocolates: 10, Bolsas: 50, Biblias: 30, Tarjetas: 50 }; // si el Sheet tiene una fila "Mínimo", manda esa
const stk = { form: null, guardando: false, error: '', ok: '', valores: {} };

function momento(fecha, h) {
  if (!h) return fecha + ' 99:99';
  const [hh, mm] = String(h).split(':');
  return fecha + ' ' + hh.padStart(2, '0') + ':' + (mm || '00');
}
const vacio = v => v === '' || v == null;

function calcularStock() {
  const filas = estado.datos.Stock || [];
  const entregas = estado.datos.Entregas || [];
  const minimos = { ...MINIMOS };
  filas.filter(f => f.Tipo === 'Mínimo').forEach(f => STOCK.forEach(([m]) => { if (!vacio(f[m])) minimos[m] = Number(f[m]); }));
  // los ultimos cuatro domingos con entregas, para estimar cuanto dura
  const domingos = [...new Set(entregas.map(f => f.Fecha))].sort().slice(-4);

  return STOCK.map(([nombre, accion]) => {
    const col = nombre === 'Tarjetas' ? 'Chocolates' : nombre;
    const rec = filas.filter(f => f.Tipo === 'Recuento' && !vacio(f[nombre]))
      .sort((a, b) => momento(a.Fecha, a.Hora).localeCompare(momento(b.Fecha, b.Hora))).pop();
    const item = { nombre, accion, min: minimos[nombre], queda: null, rec };
    if (!rec) return item;
    const desde = momento(rec.Fecha, rec.Hora);
    const entra = filas.filter(f => f.Tipo === 'Compra' && momento(f.Fecha, f.Hora) > desde)
      .reduce((a, f) => a + (Number(f[nombre]) || 0), 0);
    const sale = entregas.filter(f => momento(f.Fecha, f['Reunión']) > desde)
      .reduce((a, f) => a + (Number(f[col]) || 0), 0);
    item.queda = Math.max(0, Number(rec[nombre]) + entra - sale);
    item.bajo = item.queda <= item.min;
    const porDomingo = domingos.length ? entregas.filter(f => domingos.includes(f.Fecha))
      .reduce((a, f) => a + (Number(f[col]) || 0), 0) / domingos.length : 0;
    if (porDomingo >= 0.5) item.dura = Math.floor(item.queda / porDomingo);
    return item;
  });
}

function fechaCorta(f) { const d = fechaDe(f); return `${d.getDate()}/${d.getMonth() + 1}`; }

function vistaStock() {
  const items = calcularStock();
  const movs = (estado.datos.Stock || []).filter(f => f.Tipo === 'Recuento' || f.Tipo === 'Compra')
    .sort((a, b) => momento(b.Fecha, b.Hora).localeCompare(momento(a.Fecha, a.Hora))).slice(0, 6);

  let html = `
    <div class="rotulo">Stock</div>
    <h1 style="font-size:clamp(30px,4.4vw,44px)">Lo que nos queda</h1>
    <p class="sub">Sale del último recuento, más lo que se compró, menos lo que se entregó después.</p>
    <div class="stock">${items.map(i => `
      <div class="item${i.bajo ? ' bajo' : ''}">
        <h3>${i.nombre}</h3>
        <div class="num">${i.queda == null ? '—' : i.queda}</div>
        <span class="pill">${i.queda == null ? 'Sin recuento' : i.bajo ? 'Hay que ' + i.accion : 'Alcanza'}</span>
        <small>Mínimo ${i.min}${i.dura == null ? '' : i.dura ? ` · alcanza para ~${i.dura} domingo${i.dura === 1 ? '' : 's'}` : ' · no llega a un domingo'}</small>
        ${i.rec ? `<small>Contado el ${fechaCorta(i.rec.Fecha)}</small>` : ''}
        ${i.nombre === 'Tarjetas' ? '<small>Se gasta una con cada chocolate</small>' : ''}
      </div>`).join('')}</div>
    <div class="acciones">
      <button class="boton${stk.form === 'Recuento' ? ' primario' : ''}" data-stock-form="Recuento">Contamos lo que hay</button>
      <button class="boton${stk.form === 'Compra' ? ' primario' : ''}" data-stock-form="Compra">Llegó una compra</button>
    </div>
    ${stk.ok ? `<div class="guardando ok" style="margin-top:12px;font-size:15px">${esc(stk.ok)}</div>` : ''}`;

  if (stk.form) {
    const esRec = stk.form === 'Recuento';
    html += `<form class="form" id="formStock">
      <h3>${esRec ? 'Recuento' : 'Compra'}</h3>
      <p class="sub">${esRec ? 'Contá lo que hay ahora mismo. Lo que no contaste, dejalo vacío.' : 'Cuánto llegó de cada cosa. Lo que no se compró, dejalo vacío.'}</p>
      <div class="campos">${STOCK.map(([m]) => `
        <label>${m}<input type="number" inputmode="numeric" min="0" max="10000" name="${m}" value="${esc(stk.valores[m] || '')}"></label>`).join('')}</div>
      <label class="nota-campo">Nota (opcional)<input type="text" name="nota" maxlength="200" value="${esc(stk.valores.nota || '')}"></label>
      <div class="acciones" style="margin-top:14px">
        <button class="boton primario" type="submit" ${stk.guardando ? 'disabled' : ''}>${stk.guardando ? 'Cargando…' : 'Cargar'}</button>
        <button class="boton" type="button" data-stock-form="">Cancelar</button>
      </div>
      <div class="guardando${stk.error ? ' error' : ''}">${esc(stk.error)}</div>
    </form>`;
  }

  if (movs.length) {
    html += `<div class="movs"><h2>Últimos movimientos</h2><ul>${movs.map(f => `
      <li><b>${f.Tipo === 'Compra' ? 'Compra' : 'Recuento'} · ${fechaCorta(f.Fecha)}</b>
        ${STOCK.filter(([m]) => !vacio(f[m])).map(([m]) => `${f.Tipo === 'Compra' ? '+' : ''}${esc(f[m])} ${m.toLowerCase()}`).join(' · ')}
        ${f.Nota ? `<br><span>${esc(f.Nota)}</span>` : ''}</li>`).join('')}</ul></div>`;
  }
  $('#v-stock').innerHTML = html;
}

async function guardarStock(form) {
  const valores = {};
  STOCK.forEach(([m]) => { const v = form.elements[m].value.trim(); if (v !== '') valores[m] = Number(v); });
  const nota = form.elements.nota.value.trim();
  // Lo escrito queda en pantalla mientras se carga y si algo falla.
  stk.valores = { ...valores, nota };
  if (!Object.keys(valores).length) { stk.error = 'Poné al menos una cantidad.'; return vistaStock(); }
  stk.guardando = true; stk.error = ''; stk.ok = '';
  vistaStock();
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({
      clave: clave(), accion: 'stock', tipo: stk.form, valores, nota }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    (estado.datos.Stock = estado.datos.Stock || []).push(j.fila);
    guardado.escribir('datos', JSON.stringify(estado.datos));
    stk.ok = `✓ ${stk.form} cargado a las ${horaAhora()}: ${Object.entries(valores).map(([m, n]) => `${m} ${n}`).join(' · ')}`;
    stk.form = null; stk.valores = {};
  } catch (err) {
    stk.error = 'No se cargó. Revisá la conexión y tocá Cargar de nuevo.';
  }
  stk.guardando = false;
  vistaStock();
}

// ---------- vista: entregas ----------

const MATERIALES = [
  ['Chocolates', 'primera vez'],
  ['Bolsas', 'segunda vez'],
  ['Biblias', 'aceptaron a Jesús'],
];
const ent = { fecha: null, reunion: null, elegida: false, enviando: false, error: '', ok: null, sinCargar: leerSinCargar() };

function horaAhora() {
  const h = new Date();
  return `${String(h.getHours()).padStart(2, '0')}:${String(h.getMinutes()).padStart(2, '0')}`;
}

// Lo que se toco y todavia no se cargo: { 'AAAA-MM-DD|10:00': { Chocolates: 3 } }.
// Queda guardado en el dispositivo (sobrevive si el iPad se bloquea o se
// recarga la pagina). Solo vale para hoy: otro dia ese domingo ya esta cerrado.
function leerSinCargar() {
  let todo = {};
  try { todo = JSON.parse(guardado.leer('sinCargar')) || {}; } catch (e) {}
  const hoy = iso(new Date());
  Object.keys(todo).forEach(k => { if (!k.startsWith(hoy + '|')) delete todo[k]; });
  return todo;
}
function escribirSinCargar() { guardado.escribir('sinCargar', JSON.stringify(ent.sinCargar)); }
const claveCarga = (fecha, reunion) => fecha + '|' + reunion;
function sinCargarDe(fecha, reunion) { return ent.sinCargar[claveCarga(fecha, reunion)] || {}; }
const conSigno = n => (n > 0 ? '+' : '') + n;

// Para anotar: hoy si es domingo; si no, el ultimo domingo (para cargar tarde).
function domingoParaAnotar() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return iso(d);
}

// Los horarios salen de los Turnos de esa fecha; si no hay, los de la epoca.
function reunionesDe(fecha) {
  const g = porFecha();
  if (g[fecha]) return g[fecha].map(t => t['Reunión']);
  return fecha >= '2026-10-01' ? ['10:00', '12:00', '18:00'] : ['11:00', '17:00', '19:00'];
}

// La reunion en curso: la ultima cuya llegada (una hora antes) ya paso.
function reunionActual(fecha, lista) {
  if (fecha !== iso(new Date())) return lista[0];
  const ahora = new Date(), min = ahora.getHours() * 60 + ahora.getMinutes();
  let elegida = lista[0];
  lista.forEach(r => { const [h, m] = r.split(':').map(Number); if (min >= h * 60 + m - 60) elegida = r; });
  return elegida;
}

function esDomingoHoy(fecha) {
  const hoy = new Date();
  return hoy.getDay() === 0 && fecha === iso(hoy);
}
// El domingo se puede anotar en cualquier horario hasta la medianoche (a veces
// se cargan tarde). El lunes ese domingo ya queda cerrado.
function puedeAnotar(fecha, reunion) {
  return esDomingoHoy(fecha) && reunionesDe(fecha).includes(reunion);
}

// A las 9, 11 y 17 (la llegada de cada reunion) la pantalla pasa sola al
// horario siguiente, aunque el iPad quede abierto en Entregas toda la mañana
// (salvo que alguien haya elegido otro horario a mano).
setInterval(() => {
  if (estado.datos && !$('#v-entregas').hidden && !ent.enviando) vistaEntregas();
}, 60000);

function filaEntrega(fecha, reunion) {
  return estado.datos.Entregas.find(f => f.Fecha === fecha && f['Reunión'] === reunion);
}

function vistaEntregas() {
  if (!estado.datos.Entregas) estado.datos.Entregas = [];
  if (!ent.fecha) ent.fecha = domingoParaAnotar();
  const lista = reunionesDe(ent.fecha);
  // Solo se anota el domingo de hoy. Arranca en la reunion en curso, pero se
  // puede pasar a otro horario. Los domingos pasados se miran, sin tocar.
  const actual = esDomingoHoy(ent.fecha) ? reunionActual(ent.fecha, lista) : null;
  // Con algo sin cargar la pantalla no cambia de horario sola.
  const fijada = ent.reunion && lista.includes(ent.reunion) && Object.keys(sinCargarDe(ent.fecha, ent.reunion)).length;
  if (actual && !ent.elegida && !fijada) ent.reunion = actual;
  else if (!ent.reunion || !lista.includes(ent.reunion)) ent.reunion = lista[0];
  const editable = puedeAnotar(ent.fecha, ent.reunion);
  const d = fechaDe(ent.fecha);
  const ant = new Date(d); ant.setDate(d.getDate() - 7);
  const sig = new Date(d); sig.setDate(d.getDate() + 7);
  const puedeSig = iso(sig) <= domingoParaAnotar();
  const fila = filaEntrega(ent.fecha, ent.reunion) || {};
  const falta = editable ? sinCargarDe(ent.fecha, ent.reunion) : {};
  const hayFalta = Object.keys(falta).length > 0;
  const ok = ent.ok && ent.ok.fecha === ent.fecha && ent.ok.reunion === ent.reunion ? ent.ok.texto : '';
  const del = estado.datos.Entregas.filter(f => f.Fecha === ent.fecha);
  const total = m => del.reduce((a, f) => a + (Number(f[m]) || 0), 0);

  $('#v-entregas').innerHTML = `
    <div class="mesbar">
      <div style="margin-right:auto">
        <div class="rotulo">Entregas</div>
        <h1 style="font-size:clamp(30px,4.4vw,44px)">Domingo ${d.getDate()} de ${MESES[d.getMonth()]}</h1>
      </div>
      <button class="flecha" data-ent-fecha="${iso(ant)}" aria-label="Domingo anterior">‹</button>
      <button class="flecha" data-ent-fecha="${puedeSig ? iso(sig) : ''}" ${puedeSig ? '' : 'disabled'} aria-label="Domingo siguiente">›</button>
    </div>
    <div class="horarios">${lista.map(r =>
      `<button data-reunion="${esc(r)}" aria-pressed="${r === ent.reunion}"${Object.keys(sinCargarDe(ent.fecha, r)).length ? ' class="con-pendiente"' : ''}>${esc(hora(r))} hs</button>`).join('')}</div>
    <div class="materiales">${MATERIALES.map(([m, para]) => {
      const n = (Number(fila[m]) || 0) + (falta[m] || 0);
      return `<div class="material">
        <div><h3>${m}</h3><small>${para}</small></div>
        <div class="contador">
          <button data-sumar="-1" data-material="${m}" ${n && editable && !ent.enviando ? '' : 'disabled'} aria-label="Restar ${m}">−</button>
          <span class="num">${n}</span>
          <button class="mas" data-sumar="1" data-material="${m}" ${editable && !ent.enviando ? '' : 'disabled'} aria-label="Sumar ${m}">+</button>
        </div>
        <div class="sin-cargar">${falta[m] ? `${conSigno(falta[m])} sin cargar` : ''}</div>
      </div>`;
    }).join('')}</div>
    <div class="carga">
      ${editable ? `<button class="boton primario" id="cargarEntregas" ${hayFalta && !ent.enviando ? '' : 'disabled'}>${ent.enviando ? 'Cargando…' : 'Cargar'}</button>
      ${hayFalta && !ent.enviando ? '<button class="boton" id="deshacerEntregas">Deshacer</button>' : ''}` : ''}
      <div class="guardando${ent.error ? ' error' : ent.enviando ? '' : hayFalta ? ' por-cargar' : ok ? ' ok' : ''}">${
        ent.error ? esc(ent.error) : ent.enviando ? 'No cierres la página…'
          : hayFalta ? 'Todavía no está cargado: tocá Cargar para confirmar.'
          : ok ? esc(ok)
          : editable ? 'Tocá + o − y después Cargar.' : 'Domingo cerrado: solo para mirar.'}</div>
    </div>
    <div class="totales">Todo el domingo: <b>${total('Chocolates')}</b> chocolates · <b>${total('Bolsas')}</b> bolsas · <b>${total('Biblias')}</b> Biblias</div>`;
  $('nav [data-vista="entregas"]').classList.toggle('con-pendiente', Object.keys(ent.sinCargar).length > 0);
}

// Los toques no salen: se acumulan hasta que alguien toca Cargar.
function tocar(material, cuanto) {
  const fecha = ent.fecha, reunion = ent.reunion;
  if (ent.enviando) return;
  if (!puedeAnotar(fecha, reunion)) return vistaEntregas();
  const k = claveCarga(fecha, reunion);
  const falta = ent.sinCargar[k] || {};
  const fila = filaEntrega(fecha, reunion) || {};
  const nuevo = (falta[material] || 0) + cuanto;
  if ((Number(fila[material]) || 0) + nuevo < 0) return;
  if (nuevo) falta[material] = nuevo; else delete falta[material];
  if (Object.keys(falta).length) ent.sinCargar[k] = falta; else delete ent.sinCargar[k];
  ent.error = ''; ent.ok = null;
  escribirSinCargar();
  vistaEntregas();
}

function deshacerEntregas() {
  delete ent.sinCargar[claveCarga(ent.fecha, ent.reunion)];
  ent.error = ''; ent.ok = null;
  escribirSinCargar();
  vistaEntregas();
}

// Manda lo acumulado. El script suma de a 10 como maximo por pedido. Lo que ya
// salio se descuenta en el momento: si se corta a la mitad, en pantalla queda
// solo lo que falta, y Cargar de nuevo no repite lo anterior.
async function cargarEntregas() {
  const fecha = ent.fecha, reunion = ent.reunion, k = claveCarga(fecha, reunion);
  const falta = ent.sinCargar[k];
  if (ent.enviando || !falta || !puedeAnotar(fecha, reunion)) return;
  const resumen = Object.entries(falta).map(([m, n]) => `${m} ${conSigno(n)}`).join(' · ');
  ent.enviando = true; ent.error = ''; ent.ok = null;
  vistaEntregas();
  try {
    for (const material of Object.keys(falta)) {
      while (falta[material]) {
        const cuanto = Math.max(-10, Math.min(10, falta[material]));
        const r = await fetch(API, { method: 'POST', body: JSON.stringify({
          clave: clave(), accion: 'sumar', fecha, reunion, material, cuanto }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        let fila = filaEntrega(fecha, reunion);
        if (!fila) { fila = { Fecha: fecha, 'Reunión': reunion, Chocolates: 0, Bolsas: 0, Biblias: 0 }; estado.datos.Entregas.push(fila); }
        fila[material] = j.valor;
        falta[material] -= cuanto;
        if (!falta[material]) delete falta[material];
        escribirSinCargar();
        guardado.escribir('datos', JSON.stringify(estado.datos));
      }
    }
    delete ent.sinCargar[k];
    escribirSinCargar();
    ent.ok = { fecha, reunion, texto: `✓ Cargado a las ${horaAhora()} · ${hora(reunion)} hs: ${resumen}` };
  } catch (err) {
    ent.error = 'No se cargó todo. Lo que dice "sin cargar" falta: revisá la conexión y tocá Cargar de nuevo.';
  }
  ent.enviando = false;
  vistaEntregas();
  vistaStock();
}

// ---------- navegacion y eventos ----------

const VISTAS = ['info', 'turnos', 'entregas', 'stock', 'manual'];

function mostrar(vista) {
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.vista === vista) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  VISTAS.forEach(v => { $('#v-' + v).hidden = v !== vista; });
  guardado.escribir('vista', vista);
  window.scrollTo(0, 0);
}

function pintar() {
  vistaTurnos(); vistaEntregas(); vistaStock(); vistaInfo(); vistaManual();
}

document.addEventListener('click', e => {
  const nav = e.target.closest('nav button');
  if (nav) return mostrar(nav.dataset.vista);
  const chip = e.target.closest('[data-yo]');
  if (chip) {
    estado.yo = chip.dataset.yo === estado.yo ? null : chip.dataset.yo;
    guardado.escribir('yo', estado.yo);
    if (!estado.yo) estado.soloMios = false;
    return pintar();
  }
  const flecha = e.target.closest('.flecha');
  if (flecha && flecha.dataset.mes) { estado.mes = flecha.dataset.mes; return vistaTurnos(); }
  if (e.target.id === 'actualizar') return cargar();
  const hor = e.target.closest('[data-reunion]');
  if (hor) { ent.reunion = hor.dataset.reunion; ent.elegida = true; return vistaEntregas(); }
  const dom = e.target.closest('[data-ent-fecha]');
  if (dom && dom.dataset.entFecha) { ent.fecha = dom.dataset.entFecha; ent.reunion = null; ent.elegida = false; return vistaEntregas(); }
  const toque = e.target.closest('[data-sumar]');
  if (toque) return tocar(toque.dataset.material, Number(toque.dataset.sumar));
  if (e.target.id === 'cargarEntregas') return cargarEntregas();
  if (e.target.id === 'deshacerEntregas') return deshacerEntregas();
  const ir = e.target.closest('[data-ir]');
  if (ir) return mostrar(ir.dataset.ir);
  const sf = e.target.closest('[data-stock-form]');
  if (sf && !stk.guardando) { stk.form = sf.dataset.stockForm === stk.form ? null : (sf.dataset.stockForm || null); stk.error = ''; stk.ok = ''; stk.valores = {}; return vistaStock(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'formStock') return;
  e.preventDefault();
  if (!stk.guardando) guardarStock(e.target);
});
document.addEventListener('change', e => {
  if (e.target.id === 'soloMios') { estado.soloMios = e.target.checked; vistaTurnos(); }
});

// ---------- carga ----------

function clave() {
  const q = new URLSearchParams(location.search).get('clave');
  if (q) guardado.escribir('clave', q);
  return q || guardado.leer('clave');
}

function pie(texto) {
  $('#pie').hidden = false;
  $('#pie').innerHTML = `${texto} · <button id="actualizar">Actualizar</button>`;
}

function arrancar(datos) {
  estado.datos = datos;
  $('#estado').hidden = true;
  pintar();
  // #turnos o #manual en el link abren directo esa pestaña
  const pedida = location.hash.slice(1);
  const ultima = guardado.leer('vista');
  mostrar(VISTAS.includes(pedida) ? pedida : (VISTAS.includes(ultima) ? ultima : 'info'));
}

async function cargar() {
  const k = clave();
  if (!k) {
    $('#estado').innerHTML = '<h2>Falta el link del equipo</h2><p>Abrí la app desde el link que te pasaron las coordinadoras.</p>';
    return;
  }
  // Mientras llega lo nuevo, se muestra lo ultimo que se vio en este dispositivo.
  const previo = guardado.leer('datos');
  if (previo && !estado.datos) { try { arrancar(JSON.parse(previo)); pie('Actualizando…'); } catch (e) {} }

  try {
    const r = await fetch(API + '?clave=' + encodeURIComponent(k));
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    guardado.escribir('datos', JSON.stringify(j.datos));
    const mesAntes = estado.mes;
    arrancar(j.datos);
    if (mesAntes) { estado.mes = mesAntes; vistaTurnos(); }
    const h = new Date();
    pie(`Actualizado ${String(h.getHours()).padStart(2, '0')}:${String(h.getMinutes()).padStart(2, '0')}`);
  } catch (err) {
    if (estado.datos) return pie('Sin conexión: mostrando lo último guardado');
    const msj = /clave/.test(err.message)
      ? '<h2>El link no es válido</h2><p>Pedile el link del equipo a las coordinadoras.</p>'
      : '<h2>No se pudo cargar</h2><p>Revisá la conexión y probá de nuevo.</p><p><button class="chip" id="actualizar">Reintentar</button></p>';
    $('#estado').innerHTML = msj;
  }
}

cargar();
</script>
